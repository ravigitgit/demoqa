name: Run DemoQA Playwright in Kubernetes (kind)

on:
  workflow_dispatch:

jobs:
  run-playwright-k8s:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: demoqa:latest
      JOB_NAME: demoqa-playwright-tests
      NAMESPACE: default
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (optional, multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: demoqa-kind
          wait: 60s

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME .

      - name: Load image into kind
        run: |
          kind load docker-image $IMAGE_NAME --name demoqa-kind

      - name: Ensure kubectl uses kind context
        run: |
          kubectl cluster-info
          kubectl config current-context

      - name: Create namespace (optional)
        run: |
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Kubernetes secret from .env or GitHub Secrets
        id: create-secret
        run: |
          if [ -f .env ]; then
            echo ".env found — creating secret from it"
            kubectl delete secret demoqa-secret --ignore-not-found
            kubectl create secret generic demoqa-secret --from-env-file=.env
          else
            echo ".env not found — creating secret from GitHub Actions secrets"
            kubectl delete secret demoqa-secret --ignore-not-found
            kubectl create secret generic demoqa-secret \
              --from-literal=DEMOQA_BASE_URL="${{ secrets.DEMOQA_BASE_URL }}" \
              --from-literal=DEMOQA_USERNAME="${{ secrets.DEMOQA_USERNAME }}" \
              --from-literal=DEMOQA_PASSWORD="${{ secrets.DEMOQA_PASSWORD }}"
          fi

      - name: Create PVC for reports (optional)
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: playwright-reports-pvc
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
          EOF

      - name: Create Kubernetes Job to run Playwright tests
        run: |
          cat <<EOF | kubectl apply -n $NAMESPACE -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${{ env.JOB_NAME }}
          labels:
            job-name: ${{ env.JOB_NAME }}
          spec:
            backoffLimit: 0
          template:
          metadata:
          labels:
            job-name: ${{ env.JOB_NAME }}
          spec:
          restartPolicy: Never
          containers:
            - name: demoqa-tests
              image: ${{ env.IMAGE_NAME }}
              imagePullPolicy: IfNotPresent
              env:
                - name: DEMOQA_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: demoqa-secret
                      key: DEMOQA_BASE_URL
                - name: DEMOQA_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: demoqa-secret
                      key: DEMOQA_USERNAME
                - name: DEMOQA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: demoqa-secret
                      key: DEMOQA_PASSWORD
              volumeMounts:
                - name: artifacts
                  mountPath: /app/test-results
              command: ["npx"]
              args: ["playwright", "test", "--reporter=html,line", "--output=/app/test-results", "--workers=1"]
          volumes:
            - name: artifacts
              persistentVolumeClaim:
                claimName: playwright-reports-pvc
          EOF

      - name: Wait for Job to complete (timeout 10m)
        run: |
          kubectl wait --for=condition=complete --timeout=600s job/${JOB_NAME}

      - name: Get pod name
        id: pod
        run: |
          POD=$(kubectl get pods -l job-name=${JOB_NAME} -o jsonpath='{.items[0].metadata.name}')
          echo "pod=$POD" >> $GITHUB_OUTPUT

      - name: Dump pod logs
        run: |
          echo "Pod is ${{ steps.pod.outputs.pod }}"
          kubectl logs ${{ steps.pod.outputs.pod }} -c demoqa-tests --tail=1000 > test-pod.log || true
          cat test-pod.log

      - name: Copy test-results from pod
        run: |
          mkdir -p ./k8s-results
          kubectl cp ${NAMESPACE}/${{ steps.pod.outputs.pod }}:/app/test-results ./k8s-results -c demoqa-tests || echo "no test-results folder or copy failed"

      - name: Upload logs & results
        uses: actions/upload-artifact@v4
        with:
          name: playwright-k8s-results
          path: |
            test-pod.log
            k8s-results

      - name: "Cleanup: delete job and pvc"
        if: always()
        run: |
          kubectl delete job ${JOB_NAME} --ignore-not-found
          kubectl delete pvc playwright-reports-pvc --ignore-not-found
          kind delete cluster --name demoqa-kind || true

apiVersion: batch/v1
kind: Job
metadata:
  name: demoqa-playwright-tests
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: demoqa-tests
          image: ghcr.io/ravigitgit/demoqa:latest
          imagePullPolicy: Always
          env:
            - name: DEMOQA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: demoqa-secret
                  key: DEMOQA_BASE_URL
            - name: DEMOQA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: demoqa-secret
                  key: DEMOQA_USERNAME
            - name: DEMOQA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demoqa-secret
                  key: DEMOQA_PASSWORD
          # persist reports to this path (backed by PVC or emptyDir)
          volumeMounts:
            - name: artifacts
              mountPath: /app/test-results
          # override if you want; default CMD in image will also run tests
          command: ["npx"]
          args: ["playwright", "test", "--reporter=html,line", "--output=/app/test-results"]
      volumes:
        - name: artifacts
          emptyDir: {}
